<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Attraction Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Global Immersive Animations */
    @keyframes ecg { 0% { transform: translateX(0); } 100% { transform: translateX(-25%); } }
    @keyframes loading-sweep { 0% { opacity: 0; transform: translateX(-100%); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
    @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @keyframes screen-shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    @keyframes glitch-aberration {
      0% { text-shadow: 2px 0 0 red, -2px 0 0 blue; filter: contrast(1); }
      50% { text-shadow: -2px 0 0 red, 2px 0 0 blue; filter: contrast(1.5); }
      100% { text-shadow: 2px 0 0 red, -2px 0 0 blue; filter: contrast(1); }
    }
    @keyframes pulse-red-border {
      0% { border-color: rgba(127, 29, 29, 0.4); box-shadow: 0 0 0 0 rgba(127, 29, 29, 0); }
      50% { border-color: rgba(220, 38, 38, 0.6); box-shadow: 0 0 15px 0 rgba(220, 38, 38, 0.2); }
      100% { border-color: rgba(127, 29, 29, 0.4); box-shadow: 0 0 0 0 rgba(127, 29, 29, 0); }
    }
    @keyframes loading-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes heartbeat-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-400px); } }
    @keyframes pulse-staggered {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
      50% { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgb(0 92 75 / 0.2); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes slow-zoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    @keyframes short-circuit {
      0%, 100% { opacity: 1; transform: scale(1) translateX(0); filter: hue-rotate(0deg); }
      10% { opacity: 0.3; transform: scale(1.05) translateX(-2px); filter: hue-rotate(90deg); }
      20% { opacity: 0.8; transform: scale(0.98) translateX(2px); }
      30% { opacity: 0; }
      40% { opacity: 0.9; transform: scale(1.1); filter: hue-rotate(-90deg); }
      50% { opacity: 0.4; transform: skewX(10deg); }
      70% { opacity: 1; transform: skewX(-5deg); }
      90% { opacity: 0.2; transform: translateY(-3px); }
    }
    @keyframes pulse-cta {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 255, 142, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(142, 255, 142, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(142, 255, 142, 0); }
    }

    /* Animation Utility Classes */
    .animate-ecg { animation: ecg 2.5s linear infinite; }
    .animate-loading-sweep { animation: loading-sweep 2s infinite linear; }
    .animate-scan { animation: scan 3s infinite ease-in-out; }
    .animate-shake { animation: screen-shake 0.1s infinite; }
    .animate-glitch { animation: glitch-aberration 0.2s infinite; }
    .animate-pulse-red { animation: pulse-red-border 2s infinite; }
    .animate-heartbeat-scroll { animation: heartbeat-scroll 10s linear infinite; }
    .animate-pulse-staggered { animation: pulse-staggered 3s infinite ease-in-out; }
    .animate-slow-zoom { animation: slow-zoom 20s infinite alternate; }
    .animate-short-circuit { animation: short-circuit 0.4s infinite; }
    .animate-pulse-cta { animation: pulse-cta 2s infinite cubic-bezier(0.4, 0, 0.6, 1); }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-x-hidden">
  <div id="root"></div>
</body>
</html>
