<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Attraction Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes ecg { 0% { transform: translateX(0); } 100% { transform: translateX(-25%); } }
    @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @keyframes glitch { 0% { text-shadow: 1px 0 red; } 50% { text-shadow: -1px 0 blue; } 100% { text-shadow: 1px 0 red; } }
    @keyframes loading-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes slow-zoom { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    @keyframes button-pulse {
      0% { transform: scale(1); box-shadow: 0 0 40px rgba(142,255,142,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(142,255,142,0.6); }
      100% { transform: scale(1); box-shadow: 0 0 40px rgba(142,255,142,0.3); }
    }
    
    .animate-ecg { animation: ecg 1.5s linear infinite; }
    .animate-scan { animation: scan 3s infinite ease-in-out; }
    .animate-glitch { animation: glitch 0.1s infinite; }
    .animate-slow-zoom { animation: slow-zoom 20s infinite alternate; }
    .animate-button-pulse { animation: button-pulse 2s infinite ease-in-out; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-black text-white font-sans antialiased overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
